name: usesend-local

# Run from project root:
#   docker compose -f docker/local/compose.yml --env-file .env up -d
# The --env-file .env is required for ${VAR} interpolation in this file.

services:
  postgres:
    image: postgres:16
    container_name: usesend-db-local
    restart: unless-stopped
    environment:
      - POSTGRES_USER=usesend
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=usesend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usesend"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - database:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: usesend-redis-local
    restart: unless-stopped
    volumes:
      - cache:/data
    command: ["redis-server", "--maxmemory-policy", "noeviction"]

  rustfs:
    image: rustfs/rustfs:1.0.4
    container_name: usesend-rustfs-local
    restart: unless-stopped
    ports:
      - 127.0.0.1:9002:9000
      - 127.0.0.1:9001:9001
    environment:
      RUSTFS_ACCESS_KEY: usesend
      RUSTFS_SECRET_KEY: ${MINIO_PASSWORD}
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_OBS_LOGGER_LEVEL: error
    volumes:
      - rustfs:/data
    command: ["/data"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  rustfs-init:
    image: amazon/aws-cli:2.34.30
    restart: "no"
    entrypoint: ["/bin/sh", "-ec"]
    environment:
      AWS_ACCESS_KEY_ID: usesend
      AWS_SECRET_ACCESS_KEY: ${MINIO_PASSWORD}
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
      BUCKET: usesend
      APP_ORIGIN: http://localhost:3010
    depends_on:
      rustfs:
        condition: service_healthy
    command:
      - |
        s3="aws --endpoint-url http://rustfs:9000 s3api"
        $$s3 head-bucket --bucket "$$BUCKET" >/dev/null 2>&1 || $$s3 create-bucket --bucket "$$BUCKET"
        $$s3 put-bucket-cors --bucket "$$BUCKET" --cors-configuration \
          '{"CORSRules":[{"AllowedOrigins":["'"$$APP_ORIGIN"'"],"AllowedMethods":["GET","HEAD","PUT"],"AllowedHeaders":["*"],"ExposeHeaders":["ETag"],"MaxAgeSeconds":3600}]}'
        $$s3 put-bucket-policy --bucket "$$BUCKET" --policy \
          '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":"*","Action":["s3:GetObject"],"Resource":["arn:aws:s3:::'"$$BUCKET"'/*"]}]}'

  local-ses-sns:
    image: usesend/local-ses-sns:latest
    container_name: usesend-local-ses-sns
    restart: unless-stopped
    environment:
      WEBHOOK_URL: http://usesend:3000/api/ses_callback

  usesend:
    image: usesend-local:latest
    container_name: usesend
    restart: unless-stopped
    env_file:
      - ../../.env
    ports:
      - "3010:3000"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=${DATABASE_URL}
      - NEXTAUTH_URL=http://localhost:3010
      - NEXTAUTH_URL_INTERNAL=http://usesend:3000
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      # AWS real credentials
      - AWS_ACCESS_KEY=${AWS_ACCESS_KEY}
      - AWS_SECRET_KEY=${AWS_SECRET_KEY}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION}
      # GitHub OAuth
      - GITHUB_ID=${GITHUB_ID}
      - GITHUB_SECRET=${GITHUB_SECRET}
      # SMTP / Email
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_USER=${SMTP_USER}
      - FROM_EMAIL=${FROM_EMAIL}
      - AUTH_EMAIL_RATE_LIMIT=10
      - API_RATE_LIMIT=100
      # Self-hosted mode (no cloud features/limits)
      - NEXT_PUBLIC_IS_CLOUD=false
      - REDIS_URL=redis://redis:6379
      # RustFS as S3-compatible storage (local file storage). Browsers upload to
      # the API URL directly, so it has to be the published host port.
      - S3_COMPATIBLE_ACCESS_KEY=usesend
      - S3_COMPATIBLE_SECRET_KEY=${MINIO_PASSWORD}
      - S3_COMPATIBLE_API_URL=http://localhost:9002
      - S3_COMPATIBLE_PUBLIC_URL=http://localhost:9002/usesend
      - S3_COMPATIBLE_BUCKET=usesend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      local-ses-sns:
        condition: service_started
      rustfs-init:
        condition: service_completed_successfully

volumes:
  database:
  cache:
  rustfs:
